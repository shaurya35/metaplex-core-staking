[package]
name = "core-staking"
version = "0.1.0"
description = "Metaplex Core NFT staking with claim, burn-to-earn, collection stats and a time-gated Oracle"
edition.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "core_staking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = "=1.1.2"
mpl-core = "0.12.1"

[dev-dependencies]
litesvm = "0.10.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
solana-clock = "3"
borsh = "1.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
